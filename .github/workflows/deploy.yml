name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lightsail
  cancel-in-progress: true

env:
  DEPLOY_PATH: /var/www/herohub

jobs:
  deploy:
    name: Build and deploy HEROHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, bcmath, gd, intl, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        run: |
          cp .env.example .env
          php artisan key:generate --force
          npm ci
          npx vite build

      - name: Prepare Lightsail SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync files to Lightsail
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/logs/' \
            --exclude='storage/app/public/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='.phpunit.result.cache' \
            --exclude='_template_cache/' \
            -e "ssh -i ~/.ssh/lightsail.pem -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.LIGHTSAIL_SSH_USERNAME }}@${{ secrets.LIGHTSAIL_SSH_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Run Laravel post-deploy commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_SSH_HOST }}
          username: ${{ secrets.LIGHTSAIL_SSH_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_PATH }}
            if [ ! -f .env ]; then
              echo "Missing .env on server — run migrate-to-lightsail workflow first."
              exit 1
            fi
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan db:seed --class=RetailPlansSeeder --force
            php artisan db:seed --class=CorporatePlansSeeder --force
            php artisan db:seed --class=SmallBusinessPlansSeeder --force
            php artisan storage:link 2>/dev/null || ln -sfn "$(pwd)/storage/app/public" "$(pwd)/public/storage"
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo chmod -R ug+rwX storage bootstrap/cache
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
